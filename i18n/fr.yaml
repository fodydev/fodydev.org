hero2:
  other: Afrique Ouverte
subhero:
  other: Promouvoir la souveraineté africaine grâce à l'open source.
explainerText:
  other: FodyDev est une organisation open source qui vise à promouvoir la souveraineté africaine à travers les technologies libres. Nous croyons qu’en travaillant de manière ouverte, nous pouvons accomplir plus.
explainerButton:
  other: À propos de nous
sectionTitle:
  other: Participez
sectionTitle1:
  other: Rejoignez notre communauté
sectionText1:
  other: Aidez-nous à créer des outils ouverts qui soutiennent la souveraineté africaine. Que vous soyez développeur, rédacteur ou apprenant — vous êtes le bienvenu.
sectionButton1:
  other: Rejoindre la communauté
sectionTitle2:
  other: Devenir partenaire
sectionText2:
  other: Collaborez avec nous pour soutenir la souveraineté africaine par la technologie. En tant que partenaire, vous pouvez partager vos connaissances, co-développer des outils ou accompagner de nouveaux contributeurs.
sectionButton2:
  other: Participer
sectionTitle3:
  other: Devenir soutien
sectionText3:
  other: Aidez-nous à évoluer ! Votre soutien maintient nos projets actifs et accessibles. Vous pouvez faire un don ou parrainer un projet.
sectionButton3:
  other: Nous soutenir
